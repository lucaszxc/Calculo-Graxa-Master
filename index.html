<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <!-- Owl Carousel CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <title>Lubvel Lubrificantes - Calculadora de Lubrificação</title>
    <link rel="icon" href="https://i.ibb.co/P9t1YyH/Imagem-do-Whats-App-de-2024-05-28-s-16-19-11-d3a432f2-removebg-preview.png" type="image/png">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="desenvolvido no-print" style="background: #013a85;">
        <span style="color: #ffffff !important; font-weight: 600;" data-i18n="developed_by">Desenvolvido por Lubvel Lubrificantes Industriais.</span>
    </div>

    <!-- Seletor de Idioma -->
    <div class="container d-flex justify-content-end mt-3 no-print" style="max-width: 600px;">
        <div class="btn-group btn-group-sm" role="group" aria-label="Language Selector">
            <button type="button" class="btn btn-outline-light lang-btn active" data-lang="pt">PT</button>
            <button type="button" class="btn btn-outline-light lang-btn" data-lang="en">EN</button>
            <button type="button" class="btn btn-outline-light lang-btn" data-lang="fr">FR</button>
        </div>
    </div>

    <div class="container mt-2 pt-2 d-flex justify-content-center">
        <div class="row w-100 p-3 container mb-4 no-print" style="max-width: 600px; background-color: #0e1f4a; border-radius: 8px;">
            <div class="w-100 order-sm-1">
                <h1 class="d-flex w-100 justify-content-center">
                    <img style="border-radius: 4px; background-color: white; padding: 10px;" src="./assets/banner-lubvel.jpg" alt="Logo Lubvel e TotalEnergies" id="logo1" class="img-fluid" />
                </h1>
                <form class="mt-4 no-print" id="registroForm">
                    <!-- INFORMAÇÕES GERAIS -->
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="cliente" data-i18n="client_name">Nome do cliente:</label>
                            <input type="text" class="form-control" id="cliente" placeholder="Ex: Trombini" data-i18n-ph="placeholder_client">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="equipamento" data-i18n="equipment_name">Nome do equipamento:</label>
                            <input type="text" class="form-control" id="equipamento" placeholder="Ex: Exaustor Caldeira" data-i18n-ph="placeholder_equipment">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="temperatura" data-i18n="temperature">Temperatura (°C):</label>
                            <input type="number" class="form-control" id="temperatura" placeholder="Ex: 100">
                        </div>

                        <!-- SEÇÃO DE ROLAMENTOS -->
                        <div class="form-group col-md-6">
                            <label for="searchInput" data-i18n="search_bearing">Pesquisar rolamento:</label>
                            <input class="form-control" type="text" id="searchInput" placeholder="Pesquisar..." data-i18n-ph="placeholder_search">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="tipoRolamento" data-i18n="bearing_type">Tipo de rolamento:</label>
                            <select id="tipoRolamento" class="form-control">
                                <option value="" data-i18n="select_option">Selecione...</option>
                            </select>
                        </div>
                        <div class="form-group col-md-6" id="nomeRolamentoContainer" style="display: none;">
                            <label for="nomeRolamento" data-i18n="custom_bearing_name">Nome do rolamento:</label>
                            <input type="text" class="form-control" id="nomeRolamento" />
                        </div>
                        <div class="form-group col-md-6">
                            <label id="rolamentoLabel">(Usar outro)</label>
                            <button style="color: #fff !important;" type="button" class="w-100 btn btn-primary" id="toggleRolamentoMode" data-i18n="btn_add_bearing">Adicionar Rolamento</button>
                        </div>
                    </div>

                    <!-- PASSO 1: VERIFICAÇÃO DE POLIAS -->
                    <div class="card p-3 mb-3" style="background-color: #192E64;">
                        <label class="text-white" data-i18n="step1_title">Passo 1: Rotação do Equipamento</label>
                        <p class="text-white-50 small mb-2" data-i18n="step1_subtitle">O sistema do seu equipamento utiliza polias para transmissão?</p>
                        <div class="btn-group-custom">
                            <button type="button" id="btnSimPolia" class="btn btn-secondary" data-i18n="btn_pulley_yes">Sim, utiliza polias</button>
                            <button type="button" id="btnNaoPolia" class="btn btn-secondary" data-i18n="btn_pulley_no">Não, é acionamento direto</button>
                        </div>
                    </div>

                    <!-- CONTAINER CÁLCULO RPM (OCULTO) -->
                    <div id="calculoRpmContainer" class="hidden card p-3 mb-3" style="background-color: #192E64;">
                        <label class="text-white" data-i18n="rpm_pulley_title">Cálculo de RPM da Polia Movida</label>
                        <div class="form-row">
                            <div class="form-group col-md-4">
                                <label for="n1" data-i18n="label_n1">N1 (RPM Motor)</label>
                                <input type="number" id="n1" class="form-control" placeholder="1750">
                            </div>
                            <div class="form-group col-md-4">
                                <label for="d1" data-i18n="label_d1">D1 (Ø Polia Motor)</label>
                                <input type="number" id="d1" class="form-control" placeholder="100">
                            </div>
                            <div class="form-group col-md-4">
                                <label for="d2" data-i18n="label_d2">D2 (Ø Polia Movida)</label>
                                <input type="number" id="d2" class="form-control" placeholder="200">
                            </div>
                        </div>
                        <p id="resultadoRpmCalculado" class="text-center font-weight-bold h6" style="color: #2ecc71;"></p>
                    </div>

                    <!-- PASSO 2: DADOS DO ROLAMENTO -->
                    <div id="calculoGraxaContainer" class="hidden">
                        <label class="text-white mt-3" data-i18n="step2_title">Passo 2: Dados do Rolamento</label>
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="rpmFinal" data-i18n="label_rpm_final">RPM (Rotações Por Minuto)</label>
                                <input type="number" class="form-control" id="rpmFinal" required />
                            </div>
                            <div class="form-group col-md-6">
                                <label for="dExterno" data-i18n="label_outer_diam">D.Externo (D) (mm):</label>
                                <input type="number" class="form-control" step="0.01" id="dExterno" required />
                            </div>
                            <div class="form-group col-md-6">
                                <label for="dInterno" data-i18n="label_inner_diam">D.Interno (d) (mm):</label>
                                <input type="number" class="form-control" step="0.01" id="dInterno" required />
                            </div>
                            <div class="form-group col-md-6">
                                <label for="largura" data-i18n="label_width">Largura (B) (mm):</label>
                                <input type="number" class="form-control" id="largura" required />
                            </div>
                            <div class="form-group col-12">
                                <label for="fator" data-i18n="label_factor_g">Fator de Cálculo (G)</label>
                                <select id="fator" class="form-control" required>
                                    <option value="0.005" data-i18n="opt_standard_factor">0,005 (Padrão)</option>
                                    <option value="0.002" data-i18n="opt_w33_factor">0,002 (W33, etc.)</option>
                                </select>
                            </div>
                        </div>

                        <div id="errorMessage" class="my-2 text-center text-danger font-weight-bold hidden"></div>
                        <button type="button" class="w-100 mt-2 btn" id="botao-calcular" data-i18n="btn_calculate">
                            Calcular Lubrificação
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="main-resultados d-flex justify-content-center container" style="position: relative;">
        <div class="result-container" style="max-width:600px; display: none; position: relative;" id="resultados">
            <div class="print-logo-header hidden">
                <img src="./assets/banner-lubvel.jpg" alt="Logo Lubvel e TotalEnergies" class="img-fluid" />
            </div>
        </div>
    </div>
    
    <!-- Carrossel -->
    <div class="d-flex justify-content-center container mt-4 no-print" id="servicos">
        <div class="owl-carousel owl-theme" style="max-width: 600px;">
            <div><div class="item-slider"><img style="max-height:250px; width:100%; object-fit: contain;" src="assets/10-slice.png"></div></div>
            <div><div class="item-slider"><img style="max-height:250px; width:100%; object-fit: contain;" src="assets/3000-slice.png"></div></div>
            <div><div class="item-slider"><img style="max-height:250px; width:100%; object-fit: contain;" src="assets/250000-slice.png"></div></div>
            <div><div class="item-slider"><img style="max-height:250px; width:100%; object-fit: contain;" src="assets/400000-slice.png"></div></div>
            <div><div class="item-slider"><img style="max-height:250px; width:100%; object-fit: contain;" src="assets/600000-slice.png"></div></div>
            <div><div class="item-slider"><img style="max-height:250px; width:100%; object-fit: contain;" src="assets/750000-slice.png"></div></div>
        </div>  
    </div>

    <a href="https://api.whatsapp.com/send?phone=554599712081&text=Ol%C3%A1%2C%20vim%20pelo%20c%C3%A1lculo%20de%20DMN%20aqui" style="position: fixed !important; right: 2rem; bottom:2rem; z-index:9999;" target="_blank" class="no-print">
        <img style="width: 4.5rem; height: 4.5rem;" src="assets/10000403-removebg-preview.png" alt="WhatsApp" id="whats" class="whatsapp-icon img-fluid" />
    </a>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
